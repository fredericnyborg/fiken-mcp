[project]
name = "fiken-mcp"
version = "0.1.0"
description = "Rå MCP-server for Fiken API v2 med OAuth"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
base = [
  "uvicorn[standard]>=0.34.0",
  "fastapi>=0.115.7",
  "httpx>=0.28.1",
  "cryptography>=44.0.0",
  "asyncpg>=0.30.0",
  "fastmcp>=4.1.0",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8.4.2", "pytest-asyncio>=0.24.0", "respx>=0.22.0"]

[tool.uv]
# Uten dette installerer `uv sync --no-dev` (Docker-bygget) INGENTING → ingen uvicorn.
default-groups = ["base"]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
